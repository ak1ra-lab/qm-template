---
site_name: "qm-template"
site_description: "Download cloud images and create Proxmox VE VM templates"
site_url: "https://ak1ra-lab.github.io/qm-template/"
site_author: "ak1ra"
copyright: "Copyright \u0026copy; 2026 ak1ra"
repo_url: "https://github.com/ak1ra-lab/qm-template"
repo_name: "ak1ra-lab/qm-template"
docs_dir: docs
site_dir: site
dev_addr: 0.0.0.0:8000

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Usage:
      - Download images: usage/download.md
      - Create a template: usage/create.md
      - Prepare local artifacts: usage/prepare.md
      - List distros: usage/distros.md

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - md_in_html
  - toc:
      permalink: true

plugins:
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 简体中文
          build: true
          theme:
            language: zh
          nav_translations:
            Home: 首页
            Getting Started: 入门指南
            Configuration: 配置
            Usage: 使用
            Download images: 下载镜像
            Create a template: 创建虚拟机模板
            Prepare local artifacts: 准备本地产物
            List distros: 列出发行版
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
