# qm-template configuration
#
# Default location:
#   /etc/qm-template/config.toml
#
# Every setting is optional; the values shown here are the built-in defaults.

[paths]
# Directory where downloaded cloud images are stored.
images_dir = "/var/lib/qm-template"

[download]
# Downloader preference order; the first available command is used.
preferred = ["axel", "aria2c", "wget", "curl"]

# Parallel connections per file for axel and aria2c; ignored by wget and curl.
connections = 8

# Hide downloader progress output. Overridable per run with --quiet/--no-quiet.
quiet = false

# Distro used when `qm-template download` is called without a name.
default_distro = "debian"

# Verify the GPG signature of the checksum file (or, for Alpine and Arch
# Linux, of the image itself) before trusting it. Distros without an upstream
# signature (Debian, CentOS Stream) are skipped. Set to false to skip
# verification, for example when gnupg is not installed.
verify_signature = true

# Optional per-distro overrides such as [distro.debian]. `qm-template distros`
# lists every parameter with its default and accepted values, and most of them
# also have a command-line option (for example --release or --fs) that overrides
# the configuration. base_url is configuration-only. For example:
#
# [distro.debian]
# release = "bookworm-backports"
# base_url = "https://mirror.example.org/debian-cloud"

[prepare]
# Tool preference order for packing the NoCloud seed ISO; the first available
# command is used. xorriso is invoked in its mkisofs emulation mode.
preferred = ["genisoimage", "xorriso", "mkisofs"]

[create]
# Proxmox storage for the imported disk and the Cloud-Init drive.
storage = "local-lvm"
cores = 1
memory = 1024
# CPU type passed to qm as cputype=...; "host" is fastest but prevents
# migration across CPU generations. Use e.g. "x86-64-v2-AES" for portability.
cpu = "host"
bridge = "vmbr0"
# Firmware for created VMs: "auto" selects "uefi" for images whose filename
# contains "uefi" (e.g. Fedora's UEFI-UKI variant) and "bios" otherwise. UEFI
# VMs get an EFI disk (--bios ovmf, --efidisk0) with Secure Boot disabled.
firmware = "auto"

# Optional Proxmox metadata; each key is omitted from qm create when unset.
# tags = ["template", "cloud"]
# pool = "templates"
# onboot = true
# description = "Debian 13 cloud template"

[vmid]
# When --vm-id is omitted, the first free VM ID at or after start (scanning
# upward by step) is used. The 9000+ range keeps templates away from regular
# VMs. start must be at least 100.
start = 9000
step = 1

[cloudinit]
# User created (or updated) by Cloud-Init on first boot.
user = "debian"
# Kept as a fixed default so the console rescue password stays predictable;
# change it here to use something else.
password = "debian"
# Login shell for the user created by the local seed ISO (`prepare`); set it to
# "" to keep the image default, or e.g. "/bin/ash" on Alpine Linux.
shell = "/bin/bash"

# SSH public keys injected via Cloud-Init. Inline keys in sshkeys and the
# contents of every sshkeys_files entry are merged and deduplicated by SSH key
# fingerprint; `create` requires at least one key, while `prepare` falls back
# to password login when none is configured. Each inline entry must look like
# an SSH public key. No key file is read unless configured here.
sshkeys = [
    # "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... user@example.com",
]
sshkeys_files = [
    # "~/.ssh/id_ed25519.pub",
]

# Remote Proxmox VE hosts for `qm-template create --pve <name>`, which creates
# the template through the Proxmox VE API instead of running `qm` locally.
# API mode requires Proxmox VE 8.4 or newer and an API token whose user has VM
# allocation and datastore permissions; the host must provide a file-based
# storage with the "import" content type enabled. The API token secret is
# stored in this file, so keep it readable by the owner only (chmod 600), or
# set it through QM_TEMPLATE_PVE__<NAME>__TOKEN_SECRET instead.
#
# [pve.home]
# host = "pve.home.arpa"
# # node = "pve1"  # needed on a cluster with more than one node
# user = "qm-template@pve"
# token_name = "automation"
# token_secret = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
# verify_ssl = true
# # File-based storage that holds the uploaded images between runs.
# import_storage = "local"
# # Optional per-host overrides of the global sections, for example:
# # [pve.home.vmid]
# # start = 9000
# # [pve.home.create]
# # storage = "local-lvm"
# # [pve.home.cloudinit]
# # user = "debian"
