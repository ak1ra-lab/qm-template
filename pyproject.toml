[project]
name = "qm-template"
dynamic = ["version"]
description = "Download cloud images and create Proxmox VE VM templates"
authors = [{ name = "ak1ra", email = "git@ak1ra.xyz" }]
dependencies = [
    "argcomplete>=3.7.2",
    "pydantic-settings>=2.15.0",
    "proxmoxer>=2.3.0",
    "requests>=2.32.0",
    "requests-toolbelt>=1.0.0",
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = [
    "cloud-image",
    "cloud-init",
    "proxmox",
    "proxmox-ve",
    "qcow2",
    "vm-template",
]
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"

[project.urls]
Homepage = "https://github.com/ak1ra-lab/qm-template"
Repository = "https://github.com/ak1ra-lab/qm-template"
Documentation = "https://ak1ra-lab.github.io/qm-template/"
[project.scripts]
qm-template = "qm_template.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/qm_template"]

[dependency-groups]
tests = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]
lint = ["ruff>=0.16.7", "ty>=0.0.80"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.7.7", "mkdocs-static-i18n>=1.3.1", "mkdocstrings[python]>=1.0"]
dev = [
    { include-group = "tests" },
    { include-group = "lint" },
    { include-group = "docs" },
    "pre-commit>=4.6.2",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
