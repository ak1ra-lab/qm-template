# qm-template configuration
#
# Default location:
#   /etc/qm-template/config.toml
#
# Every setting is optional; the values shown here are the built-in defaults.

[paths]
# Directory where downloaded cloud images are stored.
images_dir = "/var/lib/qm-template"

[download]
# Downloader preference order; the first available command is used.
preferred = ["axel", "aria2c", "wget", "curl"]

# Parallel connections per file for axel and aria2c; ignored by wget and curl.
connections = 8

# Distro used when `qm-template download` is called without a name.
default_distro = "debian"

# Per-distro defaults for `qm-template download`.

[download.debian]
release = "trixie"       # codename, optionally with -backports
variant = "genericcloud" # genericcloud, generic, nocloud
arch = "amd64"           # amd64, arm64

[download.ubuntu]
release = "resolute"     # codename, e.g. noble, jammy
variant = "server"       # server, minimal
arch = "amd64"

[download.rocky]
release = "9"
variant = "GenericCloud" # GenericCloud, GenericCloud-LVM
arch = "x86_64"

[download.almalinux]
release = "9"
variant = "GenericCloud" # GenericCloud, GenericCloud-ext4
arch = "x86_64"

[download.fedora]
release = "44"
variant = "Generic"      # Generic, UEFI-UKI
arch = "x86_64"

[download.centos]
release = "9"
variant = "GenericCloud"
arch = "x86_64"

[download.alpine]
release = "3.24"
variant = "generic"      # generic, nocloud
arch = "x86_64"

[download.opensuse]
release = "tumbleweed"   # tumbleweed or a Leap version, e.g. "15.6"
variant = "Minimal"
arch = "x86_64"

[download.archlinux]
release = "latest"
variant = "cloudimg"     # cloudimg, basic
arch = "x86_64"

[create]
# Proxmox storage for the imported disk and the Cloud-Init drive.
storage = "local-lvm"
cores = 1
memory = 1024
bridge = "vmbr0"
ciuser = "debian"
cipassword = "debian"

# SSH keys: the file is preferred, the URL is used as a fallback.
sshkeys_file = "~/.ssh/id_ed25519.pub"
sshkeys_url = "https://github.com/your-user.keys"
